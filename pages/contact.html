<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Alley</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <header>
        <h1>Contact Alley</h1>
        <p>I'd love to hear from you! Please fill out the form below or reach out through my social media.</p>
    </header>
    <main>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>
        <section class="social-media">
            <h2>Connect with me</h2>
            <ul>
                <li><a href="https://www.linkedin.com/in/alley" target="_blank">LinkedIn</a></li>
                <li><a href="https://www.instagram.com/alleydesigns" target="_blank">Instagram</a></li>
                <li><a href="https://www.twitter.com/alleydesigns" target="_blank">Twitter</a></li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Alley. All rights reserved.</p>
    </footer>
</body>
</html>
